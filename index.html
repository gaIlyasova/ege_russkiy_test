<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ударения ЕГЭ 2026: тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDFDFD;--fg:#414142;--heading:#121214;--mut:#77777B;--card:#FFFFFF;
  --ln:#E5E5E5;--ac:#65EBBB;--ac-soft:#9AF1D2;--ac-pale:#C7F6E5;--ac-wash:#E9FAF4;
  --ok:#176B4A;--okb:#E9FAF4;--no:#A83232;--nob:#FFF0EF;
  --shadow:0 8px 28px rgba(18,18,20,.055);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#171918;--fg:#E8EAE8;--heading:#FDFDFD;--mut:#A7ACA9;--card:#202321;--ln:#373C39;--ac:#65EBBB;--ac-soft:#9AF1D2;--ac-pale:#29483D;--ac-wash:#20352D;--ok:#9AF1D2;--okb:#20352D;--no:#FF9B95;--nob:#422827;--shadow:0 8px 28px rgba(0,0,0,.16)}
}
:root[data-theme="dark"]{--bg:#171918;--fg:#E8EAE8;--heading:#FDFDFD;--mut:#A7ACA9;--card:#202321;--ln:#373C39;--ac:#65EBBB;--ac-soft:#9AF1D2;--ac-pale:#29483D;--ac-wash:#20352D;--ok:#9AF1D2;--okb:#20352D;--no:#FF9B95;--nob:#422827;--shadow:0 8px 28px rgba(0,0,0,.16)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 'Raleway',sans-serif;letter-spacing:-.01em;transition:background .2s,color .2s}
main{max-width:760px;margin:0 auto;padding:clamp(22px,5vw,42px) 20px 56px}
h1,h2,label{color:var(--heading)}
h1{font-size:clamp(28px,5vw,38px);line-height:1.16;letter-spacing:-.04em;font-weight:800;margin:0 0 8px}
p.sub{margin:0 0 28px;color:var(--mut);font-size:15px;line-height:1.5}
nav{display:flex;gap:8px;margin-bottom:20px;padding:5px;background:var(--ac-wash);border-radius:14px}
button,select,input{font:inherit;color:inherit}
button{font-weight:650}
nav button{flex:1;min-height:46px;padding:10px 14px;border:1px solid transparent;background:transparent;border-radius:10px;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
nav button:hover{background:var(--card)}
nav button.on{background:var(--card);color:var(--heading);border-color:var(--ln);box-shadow:0 2px 8px rgba(18,18,20,.045)}
button:active{transform:translateY(1px)}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:clamp(20px,4vw,30px);box-shadow:var(--shadow)}
label{display:block;font-size:15px;font-weight:700;margin:0 0 9px}
select,input{width:100%;min-height:48px;padding:11px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--card);margin-bottom:14px;outline-offset:2px}
select:focus,input:focus{border-color:var(--ac)}
.big{background:var(--ac);color:#121214;border:1px solid var(--ac);border-radius:10px;padding:13px 18px;cursor:pointer;width:100%;font-weight:750;transition:filter .18s,transform .18s}
.big:hover{filter:brightness(.97)}
.stat{display:flex;justify-content:space-between;gap:12px;color:var(--mut);font-size:14px;font-weight:650;margin-bottom:16px}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:clamp(30px,7vw,40px);font-weight:700;letter-spacing:-.035em;margin:22px 0 8px;color:var(--heading)}
.word span,.word button{min-width:32px;text-align:center;padding:3px 0}
.word button{border:1px solid var(--ac-soft);background:var(--ac-wash);border-radius:8px;cursor:pointer;font-size:inherit;font-weight:inherit;transition:background .15s,border-color .15s}
.word button:hover{border-color:var(--ac);background:var(--ac-pale)}
.word button.ok{background:var(--okb);border:1px solid var(--ok);color:var(--ok)}
.word button.no{background:var(--nob);border:1px solid var(--no);color:var(--no)}
.ctx{text-align:center;color:var(--mut);min-height:24px;font-size:14px}
.fb{margin-top:16px;padding:15px 16px;border-radius:12px;display:none;line-height:1.55}
.fb.ok{display:block;background:var(--okb);border:1px solid color-mix(in srgb,var(--ok) 24%,transparent)}
.fb.no{display:block;background:var(--nob);border:1px solid color-mix(in srgb,var(--no) 22%,transparent)}
.s{text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:3px;text-underline-offset:4px;font-weight:800;color:var(--heading)}
.hint{margin:7px 0 0;color:var(--mut);font-size:14px}
li{margin:5px 0}ul{padding:0;list-style:none}
#end h2{font-size:clamp(26px,5vw,34px);font-weight:800;letter-spacing:-.03em;margin:0 0 12px;color:var(--heading)}
#end li{padding:9px 12px;border-radius:9px;background:var(--ac-wash);margin:7px 0}
#end .big{margin-top:10px}
.g{margin:26px 0 5px;font-size:20px;letter-spacing:-.025em;font-weight:800;color:var(--heading)}
.gt{color:var(--mut);font-size:14px;line-height:1.55;margin:0 0 12px}
.w{display:inline-block;margin:4px 9px 4px 0;padding:4px 0;font-weight:600}
.w .s{background:linear-gradient(transparent 65%,var(--ac-pale) 65%);text-decoration:none}
#list{overflow-wrap:anywhere}
.hide{display:none!important}
@media(max-width:480px){main{padding:24px 14px 40px}p.sub{margin-bottom:22px}.card{border-radius:15px}.stat{font-size:13px}.word{gap:1px}.word span,.word button{min-width:28px}nav{gap:5px}nav button{padding:9px 7px;font-size:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style></head><body><main>
<h1>Ударения ЕГЭ 2026</h1>
<p class="sub">Орфоэпический словник: тренажёр и справочник.</p>
<nav><button id="t1" class="on">Тренажёр</button><button id="t2">Словарь</button></nav>

<section id="p1">
 <div class="card" id="start">
  <label for="cat">Какие слова тренируем?</label>
  <select id="cat"></select>
  <button class="big" id="go">Начать (10 слов)</button>
 </div>
 <div class="card hide" id="quiz">
  <div class="stat"><span id="n"></span><span id="sc"></span></div>
  <div class="ctx" id="ctx"></div>
  <div class="word" id="word" role="group" aria-label="Выберите ударную гласную"></div>
  <p class="hint" style="text-align:center">Нажмите на ударную гласную</p>
  <div class="fb" id="fb" role="status"></div>
  <button class="big hide" id="next" style="margin-top:14px">Дальше</button>
 </div>
 <div class="card hide" id="end"></div>
</section>

<section id="p2" class="hide">
 <input id="q" type="search" placeholder="Найти слово, например: торты" aria-label="Поиск по словарю">
 <div id="list"></div>
</section>
</main>
<script>
const D=[
["Существительные","Частые ловушки: торты, банты, шарфы, краны — ударение на первый слог; в -провод ударение на последний слог (водопровОд, газопровОд).",
["аэропОрты","бАнты","бОроду||Вин. п.: бОроду, но бородА в им. п.","бухгАлтеров","вероисповЕдание","водопровОд","газопровОд","граждАнство","дефИс","дешевИзна","диспансЕр","договорЁнность","докумЕнт","досУг","еретИк","жалюзИ|| Слово жалюзИ: ударение на конце.","знАчимость","Иксы","каталОг","квартАл||Во всех значениях: квартАл.","киломЕтр||Как и все слова на -метр, кроме «метр»: киломЕтр, сантимЕтр.","кОнусов","корЫсть","крАны","кремЕнь","кремнЯ","лЕкторов","лОктя","локтЕй","лыжнЯ","мЕстностей","намЕрение","нЕдруг|о человеке","недУг|болезнь","некролОг","нЕнависть","нефтепровОд","новостЕй","нОгтя","ногтЕй","Отзыв|о книге|Отзыв о книге: отклик, мнение, рецензия.","отзЫв|посла из страны|От глагола отозвАть: «потребовать возвращения».","Отрочество","партЕр","портфЕль","придАное","призЫв","свЁкла||Буква ё всегда ударная.","сирОты","созЫв","сосредотОчение","срЕдства","стАтуя","столЯр","тамОжня","тОрты","тУфля","цемЕнт","цЕнтнер","цепОчка","шАрфы","шофЁр","экспЕрт"]],
["Прилагательные","Краткие формы жен. рода: ударение чаще на окончание (вернА, ловкА). Красивее и красивейший: на -И-.",
["вернА","знАчимый","красИвее","красИвейший","кУхонный","ловкА","мозаИчный","оптОвый","прозорлИвый","прозорлИва","слИвовый"]],
["Глаголы","Прошедшее время жен. рода: ударение на окончание -А (взялА, началА). У мужского рода и мн. числа оно часто на корне (нАчал, нАчали). У форм 3 л. ед. ч. на -ИТ: звонИт, включИт.",
["бралА","бралАсь","взялА","взялАсь","влилАсь","ворвалАсь","воспринЯть","воспринялА","воссоздалА","вручИт","гналА","гналАсь","добралА","добралАсь","дождалАсь","дозвонИтся","дозИровать","ждалА","закУпорить","занЯть","зАнял","занялА","зАняли","заперлА","запломбировАть","защемИт","звалА","звонИт||Звонит: звонИть, а не звОнить.","кАшлянуть","клАла","клЕить","крАлась","кровоточИть","лгалА","лилА","лилАсь","наделИт","надорвалАсь","назвалАсь","накренИтся","налилА","нарвалА","начАть","нАчал","началА","нАчали","обзвонИт","облегчИть","облегчИт","облилАсь","обнялАсь","обогналА","ободралА","ободрИть","ободрИт","ободрИться","ободрИтся","обострИть","одолжИть","одолжИт","озлОбить","оклЕить","окружИт","опОшлить","освЕдомиться","освЕдомится","отбылА","отдалА","откУпорить","отозвалА","отозвалАсь","перезвонИт","перелилА","плодоносИть","пломбировАть","повторИт","позвалА","позвонИт","полилА","положИть","положИл","понЯть","понялА","послАла","прибЫть","прИбыл","прибылА","прИбыли","принЯть","прИнял","принялА","прИняли","рвалА","сверлИт","снялА","создалА","сорвалА","убралА","углубИть","укрепИт","чЕрпать","щемИт","щЁлкать"]],
["Причастия и деепричастия","Причастия на -ённый: ударение на Ё (облегчЁнный). Деепричастия на -в: ударение как в инфинитиве (начАть → начАв).",
["довезЁнный","зАгнутый","зАнятый","занятА","зАпертый","заселЁнный","заселенА","кровоточАщий","нажИвший","налИвший","нанЯвшийся","начАвший","нАчатый","низведЁнный","облегчЁнный","ободрЁнный","обострЁнный","отключЁнный","повторЁнный","поделЁнный","понЯвший","прИнятый","принятА","приручЁнный","прожИвший","снятА","сОгнутый","углублЁнный","закУпорив","начАв","начАвшись","отдАв","понЯв","прибЫв","создАв"]],
["Наречия","Наречия на до-, за-, во-: ударение на приставку (дОверху, зАсветло, вОвремя). Красивее: на -И-.",
["вОвремя","дОверху","дОнизу","дОсуха","зАсветло","красИвее","надОлго","ненадОлго"]]];
const V="аеёиоуыэюя",$=id=>document.getElementById(id);
const all=D.flatMap((g,gi)=>g[2].map(s=>{const[w,c,t]=s.split("|");return{w:w.toLowerCase(),k:[...w].findIndex(x=>x!==x.toLowerCase()),c,t,g:gi,r:w}}));
const mark=(w,k)=>[...w].map((x,i)=>i==k?'<span class="s">'+x+'</span>':x).join("");
$("cat").innerHTML='<option value="-1">Все слова</option>'+D.map((g,i)=>'<option value="'+i+'">'+g[0]+'</option>').join("");
let Q,i,sc,bad,done;
function shuf(a){a=[...a];for(let j=a.length-1;j>0;j--){const k=Math.random()*(j+1)|0;[a[j],a[k]]=[a[k],a[j]]}return a}
$("go").onclick=()=>start(all.filter(x=>$("cat").value<0||x.g==$("cat").value));
function start(p){Q=shuf(p).slice(0,10);i=0;sc=0;bad=[];$("start").classList.add("hide");$("end").classList.add("hide");$("quiz").classList.remove("hide");show()}
function show(){const x=Q[i];done=0;$("n").textContent="Слово "+(i+1)+" из "+Q.length;$("sc").textContent="Верно: "+sc;
$("ctx").textContent=x.c?"("+x.c+")":"";$("fb").className="fb";$("next").classList.add("hide");
$("word").innerHTML=[...x.w].map((c,j)=>V.includes(c)?'<button data-j="'+j+'">'+c+'</button>':'<span>'+c+'</span>').join("");
$("word").querySelectorAll("button").forEach(b=>b.onclick=()=>pick(b,+b.dataset.j))}
function pick(b,j){if(done)return;done=1;const x=Q[i],ok=j==x.k;
if(ok)sc++;else bad.push(x);
b.classList.add(ok?"ok":"no");$("word").querySelector('[data-j="'+x.k+'"]').classList.add("ok");
const tip=x.t||D[x.g][1];
$("fb").className="fb "+(ok?"ok":"no");
$("fb").innerHTML="<b>"+(ok?"Верно!":"Не совсем.")+"</b> Правильно: "+mark(x.w,x.k)+".<p class=\"hint\">"+tip+"</p>";
$("sc").textContent="Верно: "+sc;$("next").textContent=i+1<Q.length?"Дальше":"Результат";$("next").classList.remove("hide")}
$("next").onclick=()=>{if(++i<Q.length)show();else finish()};
function finish(){$("quiz").classList.add("hide");const e=$("end");e.classList.remove("hide");
e.innerHTML="<h2>"+sc+" из "+Q.length+"</h2>"+(bad.length?"<p>Повторите эти слова:</p><ul>"+bad.map(x=>"<li>"+mark(x.w,x.k)+(x.c?" ("+x.c+")":"")+"</li>").join("")+'</ul><button class="big" id="rb">Потренировать ошибки</button>':"<p>Без ошибок, отличный результат!</p>")+'<button class="big" id="ag" style="margin-top:10px">Новый раунд</button>';
if(bad.length)$("rb").onclick=()=>start(bad);
$("ag").onclick=()=>{e.classList.add("hide");$("start").classList.remove("hide")}}
function lst(f){$("list").innerHTML=D.map((g,gi)=>{const ws=all.filter(x=>x.g==gi&&x.w.includes(f));return ws.length?'<h2 class="g">'+g[0]+'</h2><p class="gt">'+g[1]+'</p>'+ws.map(x=>'<span class="w">'+mark(x.w,x.k)+(x.c?' <small>('+x.c+')</small>':'')+'</span>').join(""):""}).join("")||"<p>Ничего не найдено. Проверьте написание.</p>"}
$("q").oninput=e=>lst(e.target.value.trim().toLowerCase());lst("");
function tab(a){$("p1").classList.toggle("hide",a!=1);$("p2").classList.toggle("hide",a!=2);$("t1").classList.toggle("on",a==1);$("t2").classList.toggle("on",a==2)}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
</script></body></html>
