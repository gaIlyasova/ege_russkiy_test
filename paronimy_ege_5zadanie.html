<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Паронимы ЕГЭ: задание 5</title>
<style>
:root{--bg:#FDFDFD;--fg:#414142;--heading:#121214;--mut:#77777B;--card:#FFFFFF;--ln:#E5E5E5;--ac:#65EBBB;--ac-soft:#9AF1D2;--ac-pale:#C7F6E5;--ac-wash:#E9FAF4;--ok:#176B4A;--okb:#E9FAF4;--no:#A83232;--nob:#FFF0EF;--shadow:0 8px 28px rgba(18,18,20,.055);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#171918;--fg:#E8EAE8;--heading:#FDFDFD;--mut:#A7ACA9;--card:#202321;--ln:#373C39;--ac:#65EBBB;--ac-soft:#9AF1D2;--ac-pale:#29483D;--ac-wash:#20352D;--ok:#9AF1D2;--okb:#20352D;--no:#FF9B95;--nob:#422827;--shadow:0 8px 28px rgba(0,0,0,.16)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 "Raleway",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{color:var(--heading);font-size:26px;line-height:1.2;margin:0 0 6px}
.sub{margin:0 0 16px;color:var(--mut)}
#th{border:1px solid var(--ln);background:var(--card);border-radius:20px;padding:5px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--ac-wash);border-radius:12px;margin-bottom:16px}
button,input,select{font:inherit;color:inherit}
nav button{padding:9px 2px;border:0;background:transparent;border-radius:9px;cursor:pointer;font-size:14px}
nav button.on{background:var(--card);color:var(--heading);font-weight:600;box-shadow:var(--shadow)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:12px}
.big{width:100%;padding:13px 18px;border:0;border-radius:10px;background:var(--ac);color:#121214;font-weight:600;cursor:pointer}
.big.alt{background:var(--ac-pale);color:var(--heading);margin-top:10px}
.stat{display:flex;justify-content:space-between;color:var(--mut);font-size:15px;margin-bottom:6px}
.bar{height:6px;background:var(--ac-wash);border-radius:3px;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .25s}
.sent{font-size:20px;line-height:1.5;color:var(--heading);margin:0 0 18px}
.gap{display:inline-block;min-width:90px;padding:0 8px;border-bottom:3px solid var(--ac);text-align:center;color:var(--mut)}
.gap.ok{color:var(--ok);background:var(--okb);border-radius:6px;font-weight:600}
.gap.no{color:var(--no);background:var(--nob);border-radius:6px;text-decoration:line-through}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{padding:13px 8px;border:1px solid var(--ln);background:var(--card);border-radius:10px;cursor:pointer;font-size:18px;color:var(--heading)}
.opts button:hover:not(:disabled){border-color:var(--ac)}
.opts button.ok{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:600}
.opts button.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.fb{margin-top:16px;padding:14px;border-radius:10px;background:var(--ac-wash);display:none}
.fb.on{display:block}.fb p{margin:6px 0 0;font-size:15.5px}.fb b{color:var(--heading)}
.hide{display:none}
input,select{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:6px 12px;border:1px solid var(--ln);background:var(--card);border-radius:18px;cursor:pointer;font-size:14px}
.chips button.on{background:var(--ac-pale);border-color:var(--ac);color:var(--heading)}
.e h3{margin:0 0 6px;font-size:18px;color:var(--heading)}.e p{margin:4px 0 0;font-size:15.5px}.e b{color:var(--heading)}
.ins{color:var(--mut);font-size:15px;margin:0 0 12px}
ol.ss{padding-left:22px;margin:0 0 14px}ol.ss li{margin:8px 0;color:var(--heading)}ol.ss li.sel{background:var(--ac-wash);border-radius:6px}
.hl{background:var(--ac-pale);border-radius:4px;padding:0 3px;font-weight:700}
.row{display:flex;gap:8px}.row input{margin:0}.row .big{width:auto;white-space:nowrap}
li{margin:4px 0}ul{padding-left:20px}
@media(max-width:420px){.opts{grid-template-columns:1fr}nav button{font-size:13px}}
</style></head><body><main>
<div class="top"><div><h1>Паронимы ЕГЭ: задание 5</h1><p class="sub">Тренажёры, формат ЕГЭ и словарь паронимов.</p></div><button id="th" title="Сменить тему">Тема: авто</button></div>
<nav><button id="t1" class="on">Тренажёр</button><button id="t2">Значения</button><button id="t3">Формат ЕГЭ</button><button id="t4">Словарь</button></nav>
<section id="p1"></section><section id="p2" class="hide"></section>
<section id="p3" class="hide"></section><section id="p4" class="hide"></section>
</main>
